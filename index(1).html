<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پشتیبانی</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
        }

        .card {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 40px 30px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 15px;
            color: #222;
        }

        p {
            color: #666;
            line-height: 2;
            margin-bottom: 25px;
        }

        .call-button {
            display: block;
            padding: 16px;
            border-radius: 14px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: .2s;
        }

        .call-button:hover {
            background: #4338ca;
            transform: translateY(-2px);
        }

        .number {
            margin-top: 15px;
            color: #777;
            direction: ltr;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="icon">📞</div>

        <h1>پشتیبانی</h1>

        <p>
            برای تماس با پشتیبانی، روی دکمه زیر بزنید.
        </p>

        <a class="call-button" href="tel:09011314404">
            📞 تماس با پشتیبانی
        </a>

        <div class="number">
            09011314404
        </div>
    </div>

</body>
</html>
